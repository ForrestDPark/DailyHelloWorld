<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6650a8"><title>일본어 학습 서재</title><link rel="stylesheet" href="style.css"></head><body>
<main id="login" class="login hidden"><section class="login-card"><div class="logo">本</div><p class="eyebrow">PRIVATE LIBRARY</p><h1>일본어 학습 서재</h1><p>관리자 전용 서재입니다. 툴파챗에서 관리자 계정으로 로그인한 뒤 다시 열어주세요.</p><a class="login-link" href="/">툴파챗 로그인으로 이동</a><p id="loginError" class="error" role="alert"></p></section></main>
<main id="library" class="hidden"><header><div><p class="eyebrow">MY STUDY ARCHIVE</p><h1>일본어 학습 서재</h1></div><div class="header-actions"><button id="rescan" class="icon" title="새 EPUB 다시 찾기" aria-label="새 EPUB 다시 찾기">↻</button><button id="logout" class="subtle">툴파챗으로</button></div></header><section class="toolbar"><input id="search" type="search" placeholder="제목으로 찾기" aria-label="책 검색"><span id="count"></span></section><section id="books" class="books"></section><p id="empty" class="empty hidden">검색 결과가 없습니다.</p></main>
<main id="reader" class="reader hidden"><nav><button id="back" class="subtle">← 서재</button><strong id="readerTitle"></strong><a id="download" class="subtle" title="EPUB 내려받기">내려받기</a></nav><div class="reader-stage"><iframe id="page" title="EPUB 본문" sandbox="allow-same-origin"></iframe></div><footer><button id="prev" aria-label="이전 페이지">←</button><div><span id="position"></span><input id="chapter" type="range" min="0" value="0" aria-label="페이지 이동"></div><button id="next" aria-label="다음 페이지">→</button></footer></main>
<script src="app.js" defer></script></body></html>
