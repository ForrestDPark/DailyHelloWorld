<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>미연시</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/dating-sim/static/style.css?v=20260925-v42">
</head>
<body>
  <div id="game">
    <header id="hud">
      <div class="hud-top-row">
        <a class="back-link" href="/#home">← 나가기</a>
        <div class="hud-top-actions">
          <a id="source-epub-link" class="history-open-btn hidden" href="/epub/">📖 원작 EPUB</a>
          <button id="story-list-btn" type="button" class="history-open-btn hidden">📚 미연시 목록</button>
          <button id="tree-open-btn" type="button" class="history-open-btn hidden">🌳 시나리오 트리</button>
          <button id="history-open-btn" type="button" class="history-open-btn hidden">📜 이전 장면</button>
        </div>
      </div>
      <div id="hud-title" class="hud-title">미연시</div>
      <div class="hud-stats">
        <span id="hud-day">이야기 진행</span>
        <div class="affection-meter" aria-label="호감도">
          <span>♥ <b id="affection-value">50</b></span>
          <div class="affection-track"><i id="affection-bar"></i></div>
        </div>
      </div>
    </header>

    <div id="history-overlay" class="history-overlay hidden">
      <div class="history-panel">
        <div class="history-panel-head">
          <strong>이전 장면</strong>
          <button id="history-close-btn" type="button" class="history-close-btn" aria-label="이전 장면 닫기">×</button>
        </div>
        <div id="history-list" class="history-list"></div>
      </div>
    </div>

    <div id="story-popover" class="story-popover hidden" role="dialog" aria-label="진행 가능한 미연시 목록"></div>

    <div id="tree-overlay" class="history-overlay hidden">
      <div class="history-panel tree-panel">
        <div class="history-panel-head">
          <strong>시나리오 트리 (관리자)</strong>
          <button id="tree-close-btn" type="button" class="history-close-btn" aria-label="시나리오 트리 닫기">×</button>
        </div>
        <div id="tree-body" class="tree-body"></div>
      </div>
    </div>

    <main id="stage">
      <div id="listening-controls" class="listening-controls hidden" aria-label="일본어 듣기">
        <button id="listening-toggle" type="button" aria-pressed="false">일본어 듣기</button>
        <button id="listening-replay" type="button">다시 듣기</button>
        <button id="listening-stop" type="button" disabled>정지</button>
        <button id="writing-practice" type="button" disabled>쓰기</button>
        <button id="speaking-practice" type="button" disabled>말하기</button>
        <span id="listening-status" aria-live="polite">꺼짐</span>
      </div>
      <section id="map-view" class="hidden">
        <div class="intro-art"><img id="intro-art-image" alt="주인공이 바라보는 장소의 도트 배경"></div>
        <p class="map-hint">오늘 어떤 일이 일어날까?</p>
        <div id="map-locations" class="map-locations"></div>
      </section>

      <section id="scene-view" class="hidden">
        <div class="portrait-box">
          <div id="portrait" class="portrait"><img id="portrait-image" alt="캐릭터 초상화"></div>
          <div id="speaker-name" class="speaker-name">소이</div>
        </div>
        <div class="dialogue-box">
          <button id="dialogue-back" type="button" class="dialogue-back hidden">◀</button>
          <p id="dialogue-text"></p>
          <button id="dialogue-next" type="button" class="dialogue-next hidden">▼</button>
        </div>
        <aside id="teacher-tip" class="teacher-tip hidden" aria-live="polite">
          <button id="teacher-tip-trigger" class="teacher-tip-trigger" type="button" aria-label="일본어 선생님 도움말" aria-expanded="false">
            <img id="teacher-tip-avatar" alt="일본어 선생님">
            <span class="teacher-tip-sparkle" aria-hidden="true">✦</span>
          </button>
          <div id="teacher-tip-bubble" class="teacher-tip-bubble hidden"><strong>일본어 선생님</strong><p id="teacher-tip-text"></p><a id="teacher-tip-source" class="teacher-tip-source hidden">툴파챗 원본 메시지 보기</a></div>
        </aside>
        <div id="choice-list" class="choice-list hidden"></div>
      </section>

      <section id="result-view" class="hidden">
        <div class="portrait-box">
          <div class="portrait"><img id="result-portrait-image" alt="캐릭터 초상화"></div>
          <div id="result-speaker-name" class="speaker-name"></div>
        </div>
        <div class="dialogue-box">
          <p id="result-text"></p>
          <p id="result-affection" class="result-affection"></p>
        </div>
        <button id="result-next" type="button" class="pixel-button">다음 장면으로 (화면을 눌러도 넘어가요)</button>
      </section>

      <section id="ending-view" class="hidden">
        <h2 id="ending-title">엔딩</h2>
        <div class="portrait-box">
          <div class="portrait"><img id="ending-portrait-image" alt="캐릭터 초상화"></div>
          <div id="ending-speaker-name" class="speaker-name"></div>
        </div>
        <div class="dialogue-box"><p id="ending-text"></p></div>
        <button id="restart-btn" type="button" class="pixel-button">처음부터 다시하기</button>
      </section>

      <section id="lobby-view" class="hidden">
        <p class="lobby-hint">이어서 만날까요, 새로운 사람을 만날까요?</p>
        <button id="lobby-continue-btn" type="button" class="lobby-card hidden"></button>
        <button id="lobby-story-list-btn" type="button" class="pixel-button lobby-new-btn hidden">📚 미연시 목록 (관리자)</button>
        <button id="lobby-new-btn" type="button" class="pixel-button lobby-new-btn">✨ 새로운 만남 시작하기</button>
      </section>

      <section id="loading-view">
        <p>불러오는 중...</p>
      </section>
    </main>
  </div>

  <div id="practice-overlay" class="practice-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="practice-title">
    <section class="practice-panel">
      <header class="practice-head">
        <div><small id="practice-kicker">일본어 연습</small><h2 id="practice-title">문장 따라 쓰기</h2></div>
        <button id="practice-close" type="button" aria-label="연습 창 닫기">×</button>
      </header>
      <p id="practice-instruction" class="practice-instruction"></p>
      <div id="practice-target" class="practice-target" aria-live="polite"></div>
      <div id="writing-pane" class="practice-pane hidden">
        <div class="writing-progress"><span id="writing-position"></span><span id="writing-average"></span></div>
        <canvas id="writing-canvas" width="640" height="440" aria-label="손가락으로 일본어 글자를 쓰는 영역"></canvas>
        <div class="practice-actions">
          <button id="writing-clear" type="button">지우기</button>
          <button id="writing-grade" type="button" class="primary">이어 쓰기</button>
          <button id="writing-next" type="button" class="hidden">다음</button>
        </div>
      </div>
      <div id="speaking-pane" class="practice-pane hidden">
        <div class="speech-meter" aria-hidden="true"><i id="speech-meter-bar"></i></div>
        <p id="speech-transcript" class="speech-transcript">먼저 대사를 듣고 녹음을 시작하세요.</p>
        <div class="practice-actions">
          <button id="speech-listen" type="button">대사 듣기</button>
          <button id="speech-record" type="button" class="primary">● 녹음 시작</button>
        </div>
      </div>
      <div id="practice-result" class="practice-result hidden" aria-live="polite"></div>
      <button id="practice-continue" type="button" class="practice-continue hidden">점수 확인하고 다음 대사</button>
    </section>
  </div>
  <script src="/dating-sim/static/app.js?v=20260925-v48"></script>
</body>
</html>
