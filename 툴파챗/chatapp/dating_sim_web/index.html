<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>미연시</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/dating-sim/static/style.css?v=20260921-v17">
</head>
<body>
  <div id="game">
    <header id="hud">
      <div class="hud-top-row">
        <a class="back-link" href="/#home">← 나가기</a>
        <div class="hud-top-actions">
          <button id="tree-open-btn" type="button" class="history-open-btn hidden">🌳 시나리오 트리</button>
          <button id="history-open-btn" type="button" class="history-open-btn hidden">📜 이전 장면</button>
        </div>
      </div>
      <div id="hud-title" class="hud-title">미연시</div>
      <div class="hud-stats">
        <span id="hud-day">이야기 진행</span>
        <div class="affection-meter" aria-label="호감도">
          <span>♥ <b id="affection-value">50</b></span>
          <div class="affection-track"><i id="affection-bar"></i></div>
        </div>
      </div>
    </header>

    <div id="history-overlay" class="history-overlay hidden">
      <div class="history-panel">
        <div class="history-panel-head">
          <strong>이전 장면</strong>
          <button id="history-close-btn" type="button" class="history-close-btn" aria-label="이전 장면 닫기">×</button>
        </div>
        <div id="history-list" class="history-list"></div>
      </div>
    </div>

    <div id="tree-overlay" class="history-overlay hidden">
      <div class="history-panel tree-panel">
        <div class="history-panel-head">
          <strong>시나리오 트리 (관리자)</strong>
          <button id="tree-close-btn" type="button" class="history-close-btn" aria-label="시나리오 트리 닫기">×</button>
        </div>
        <div id="tree-body" class="tree-body"></div>
      </div>
    </div>

    <main id="stage">
      <div id="listening-controls" class="listening-controls hidden" aria-label="일본어 듣기">
        <button id="listening-toggle" type="button" aria-pressed="false">일본어 듣기</button>
        <button id="listening-replay" type="button">다시 듣기</button>
        <button id="listening-stop" type="button" disabled>정지</button>
        <span id="listening-status" aria-live="polite">꺼짐</span>
      </div>
      <section id="map-view" class="hidden">
        <div class="intro-art"><img id="intro-art-image" alt="주인공이 바라보는 장소의 도트 배경"></div>
        <p class="map-hint">오늘 어떤 일이 일어날까?</p>
        <div id="map-locations" class="map-locations"></div>
      </section>

      <section id="scene-view" class="hidden">
        <div class="portrait-box">
          <div id="portrait" class="portrait"><img id="portrait-image" alt="캐릭터 초상화"></div>
          <div id="speaker-name" class="speaker-name">소이</div>
        </div>
        <div class="dialogue-box">
          <button id="dialogue-back" type="button" class="dialogue-back hidden">◀</button>
          <p id="dialogue-text"></p>
          <button id="dialogue-next" type="button" class="dialogue-next hidden">▼</button>
        </div>
        <div id="choice-list" class="choice-list hidden"></div>
      </section>

      <section id="result-view" class="hidden">
        <div class="portrait-box">
          <div class="portrait"><img id="result-portrait-image" alt="캐릭터 초상화"></div>
          <div id="result-speaker-name" class="speaker-name"></div>
        </div>
        <div class="dialogue-box">
          <p id="result-text"></p>
          <p id="result-affection" class="result-affection"></p>
        </div>
        <button id="result-next" type="button" class="pixel-button">다음 장면으로 (화면을 눌러도 넘어가요)</button>
      </section>

      <section id="ending-view" class="hidden">
        <h2 id="ending-title">엔딩</h2>
        <div class="portrait-box">
          <div class="portrait"><img id="ending-portrait-image" alt="캐릭터 초상화"></div>
          <div id="ending-speaker-name" class="speaker-name"></div>
        </div>
        <div class="dialogue-box"><p id="ending-text"></p></div>
        <button id="restart-btn" type="button" class="pixel-button">처음부터 다시하기</button>
      </section>

      <section id="lobby-view" class="hidden">
        <p class="lobby-hint">이어서 만날까요, 새로운 사람을 만날까요?</p>
        <button id="lobby-continue-btn" type="button" class="lobby-card hidden"></button>
        <button id="lobby-new-btn" type="button" class="pixel-button lobby-new-btn">✨ 새로운 만남 시작하기</button>
      </section>

      <section id="loading-view">
        <p>불러오는 중...</p>
      </section>
    </main>
  </div>
  <script src="/dating-sim/static/app.js?v=20260921-v21"></script>
</body>
</html>
