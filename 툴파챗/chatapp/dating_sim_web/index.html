<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>미연시 · 소이와의 사흘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/dating-sim/static/style.css?v=20260915-v1">
</head>
<body>
  <div id="game">
    <header id="hud">
      <a class="back-link" href="/#home">← 나가기</a>
      <div class="hud-title">☕ 소이와의 사흘</div>
      <div class="hud-stats">
        <span id="hud-day">DAY 1 / 3</span>
        <div class="affection-meter" aria-label="호감도">
          <span>♥</span>
          <div class="affection-track"><i id="affection-bar"></i></div>
        </div>
      </div>
    </header>

    <main id="stage">
      <section id="map-view" class="hidden">
        <p class="map-hint">오늘은 어디로 가볼까?</p>
        <div id="map-locations" class="map-locations"></div>
      </section>

      <section id="scene-view" class="hidden">
        <div class="portrait-box">
          <div id="portrait" class="portrait">🙂</div>
          <div id="speaker-name" class="speaker-name">소이</div>
        </div>
        <div class="dialogue-box">
          <p id="dialogue-text"></p>
          <button id="dialogue-next" type="button" class="dialogue-next hidden">▼</button>
        </div>
        <div id="choice-list" class="choice-list hidden"></div>
      </section>

      <section id="ending-view" class="hidden">
        <h2 id="ending-title">엔딩</h2>
        <div class="portrait-box">
          <div class="portrait">🙂</div>
          <div class="speaker-name">소이</div>
        </div>
        <div class="dialogue-box"><p id="ending-text"></p></div>
        <button id="restart-btn" type="button" class="pixel-button">처음부터 다시하기</button>
      </section>

      <section id="loading-view">
        <p>불러오는 중...</p>
      </section>
    </main>
  </div>
  <script src="/dating-sim/static/app.js?v=20260915-v1"></script>
</body>
</html>
