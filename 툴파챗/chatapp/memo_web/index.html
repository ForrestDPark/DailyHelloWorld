<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171321"><title>메모 시스템</title>
  <link rel="icon" href="/static/system-icons/memo.svg?v=20260927" type="image/svg+xml">
  <link rel="stylesheet" href="/memo/static/style.css?v=20260927-mobile-editor-v2"><link rel="stylesheet" href="/memo/static/colors.css?v=20260925-v1"><link rel="stylesheet" href="/memo/static/tools.css?v=20260927-map-edit-v2"><link rel="stylesheet" href="/memo/static/voice.css?v=20260925-stop-v1">
</head>
<body>
  <header class="topbar"><a href="/#home" aria-label="홈으로">←</a><div class="topbar-title"><small>CONNECTED NOTES</small><h1>메모 시스템</h1></div><div class="topbar-actions"><button id="memo-layout" class="layout-button" type="button" aria-label="리스트 보기로 전환">☰ 리스트</button><button id="new-memo">＋ 새 메모</button></div></header>
  <main class="workspace">
    <aside class="library"><label class="search"><span>⌕</span><input id="search" placeholder="메모 검색"></label><div id="memo-list" class="memo-list"></div></aside>
    <section id="empty" class="empty"><b>메모를 선택하세요</b><p>채팅 메시지를 길게 눌러 저장하거나 새 메모를 만들 수 있어요.</p></section>
    <section id="editor" class="editor hidden">
      <div class="editor-head"><div><span id="source-label" class="source-label"></span><input id="memo-title" maxlength="160" aria-label="메모 제목" readonly></div><div class="head-actions"><button id="edit-root" type="button">✎ 메모 수정</button><button id="delete-root" class="danger">삭제</button></div></div>
      <label class="root-note"><span>내 메모</span><textarea id="memo-note" maxlength="12000" placeholder="수정 버튼을 눌러 중요한 부분만 남겨보세요" readonly></textarea><button id="edit-note-inline" class="edit-note-inline" type="button">제목과 내용 수정하기</button></label>
      <article id="source-card" class="source-card hidden"><div class="source-card-head"><div><small>채팅 원문</small><strong id="source-sender"></strong></div><div class="source-actions"><button id="source-toggle" type="button" aria-expanded="false">원문 펼치기</button><a id="source-link" href="/#chats">채팅 원문 보러가기</a></div></div><p id="source-content" class="collapsed"></p></article>
      <div class="branch-toolbar"><div><small>MIND MAP</small><h2>생각 지도</h2></div><button id="add-root-node">＋ 가지 만들기</button></div>
      <div id="mindmap-viewport" class="mindmap-viewport" aria-label="드래그와 핀치 확대가 가능한 마인드맵">
        <div class="mindmap-grid"></div>
        <div id="mindmap-stage" class="mindmap-stage"><svg id="mindmap-lines" aria-hidden="true"></svg><div id="memo-tree" class="memo-tree"></div></div>
        <div class="zoom-controls" aria-label="생각 지도 화면 도구"><button id="zoom-out" aria-label="축소">−</button><button id="zoom-fit">맞춤</button><button id="zoom-in" aria-label="확대">＋</button><span id="zoom-level">100%</span><button id="mindmap-fullscreen" aria-label="생각 지도 전체 화면" title="전체 화면">⛶</button></div>
        <div id="node-mobile-actions" class="node-mobile-actions hidden" aria-live="polite"><span id="node-mobile-label">메모 선택됨</span><button id="node-mobile-edit" type="button">수정</button><button id="node-mobile-collapse" type="button">접기</button><button id="node-mobile-delete" class="danger" type="button">삭제</button><button id="node-mobile-close" type="button" aria-label="선택 해제">×</button></div>
        <p class="canvas-hint">카드 선택 후 하단에서 수정 · 길게 눌러 이동 · 두 손가락 확대/축소</p>
      </div>
    </section>
  </main>
  <dialog id="memo-preview-dialog" class="memo-preview-dialog"><form method="dialog"><div class="dialog-head"><div><small>MEMO</small><h2 id="preview-title">메모</h2><time id="preview-date"></time></div><button value="cancel" aria-label="닫기">×</button></div><div id="preview-content" class="memo-preview-content"></div><div class="dialog-actions"><button value="cancel">닫기</button><button id="preview-open" type="button">생각 지도</button><button id="preview-edit" type="button">수정</button></div></form></dialog>
  <dialog id="memo-edit-dialog" class="memo-edit-dialog"><form method="dialog"><div class="dialog-head"><div><small>EDIT MEMO</small><h2>메모 수정</h2></div><div class="memo-edit-header-actions"><button id="memo-edit-save-top" class="memo-edit-save-top" type="button">저장</button><button value="cancel" aria-label="닫기">×</button></div></div><p class="edit-help">채팅 원문은 그대로 보존됩니다. 아래 편집본에는 다시 보고 싶은 핵심만 남기세요.</p><label><span>제목</span><input id="memo-edit-title" maxlength="160" autocomplete="off"></label><label><span>내용</span><textarea id="memo-edit-note" maxlength="12000" placeholder="중요한 문장만 남기거나 내 생각을 덧붙이세요"></textarea></label><div class="dialog-actions"><button value="cancel">취소</button><button id="memo-edit-save" type="button">변경사항 저장</button></div></form></dialog>
  <dialog id="node-dialog"><form method="dialog"><div class="dialog-head"><h2 id="node-dialog-title">파생 메모</h2><span><button id="node-voice" class="voice-button" type="button" aria-label="음성으로 파생 메모 입력">🎙️ 음성</button><button value="cancel" aria-label="닫기">×</button></span></div><textarea id="node-content" maxlength="6000" placeholder="생각, 할 일, 연결할 아이디어를 적어보세요"></textarea><div class="dialog-actions"><button value="cancel">취소</button><button id="node-save" value="default">저장</button></div></form></dialog>
  <div id="selection-toolbar" class="selection-toolbar hidden" role="toolbar" aria-label="선택한 텍스트 서식">
    <button type="button" data-format="b" aria-label="굵게" title="굵게"><b>B</b></button><button type="button" data-format="i" aria-label="기울임" title="기울임"><i>I</i></button><button type="button" data-format="u" aria-label="밑줄" title="밑줄"><u>U</u></button><button type="button" data-format="s" aria-label="취소선" title="취소선"><s>S</s></button>
    <button type="button" id="format-color-button" class="format-color" title="글자색" aria-label="글자색 선택"><span>A</span></button><button type="button" id="format-background-button" class="format-color highlight" title="배경색" aria-label="배경색 선택"><span>▰</span></button>
    <button type="button" id="format-comment" aria-label="코멘트" title="코멘트">▣</button><button type="button" id="format-clear" aria-label="서식 지우기" title="서식 지우기">Tx</button>
  </div>
  <dialog id="format-color-dialog" class="format-color-dialog">
    <form method="dialog">
      <div class="dialog-head"><div><small>TEXT STYLE</small><h2 id="format-color-title">글자색</h2></div><button value="cancel" aria-label="닫기">×</button></div>
      <label class="color-picker-field"><span>색상 선택</span><input id="format-color-picker" type="color" value="#e45775" aria-label="적용할 색상"></label>
      <div id="format-color-preview" class="format-color-preview">선택한 글자 미리보기</div>
      <div class="color-presets" aria-label="추천 색상">
        <button type="button" data-color="#e45775" style="--swatch:#e45775" aria-label="분홍"></button><button type="button" data-color="#f2994a" style="--swatch:#f2994a" aria-label="주황"></button><button type="button" data-color="#f2c94c" style="--swatch:#f2c94c" aria-label="노랑"></button><button type="button" data-color="#56cc9d" style="--swatch:#56cc9d" aria-label="초록"></button><button type="button" data-color="#5b8def" style="--swatch:#5b8def" aria-label="파랑"></button><button type="button" data-color="#a97bea" style="--swatch:#a97bea" aria-label="보라"></button>
      </div>
      <div class="dialog-actions"><button value="cancel">취소</button><button id="format-color-apply" type="button">적용</button></div>
    </form>
  </dialog>
  <div id="comment-popover" class="comment-popover hidden" role="note"><strong>코멘트</strong><p></p><button type="button" aria-label="닫기">×</button></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/memo/static/app.js?v=20260927-map-edit-v2"></script>
</body></html>
