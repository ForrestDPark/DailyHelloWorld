<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>단어장 시스템</title><link rel="manifest" href="/vocabulary/static/manifest.webmanifest"><link rel="stylesheet" href="/vocabulary/static/style.css?v=20260925-practice-v1"><link rel="stylesheet" href="/vocabulary/static/practice.css?v=20260925-v1"></head><body>
<header><a href="/#home" aria-label="홈으로">←</a><div><small>VOCABULARY SYSTEM</small><h1>단어장 시스템</h1></div><span id="total">0개</span></header>
<main><section class="hero"><p>한자와 영어 단어를 한곳에서 모아보고, 검색하며 반복해서 익혀보세요.</p><nav><button class="active" data-tab="all">전체</button><button data-tab="hanja">한자</button><button data-tab="english">영어</button></nav></section>
<section id="english-form" class="editor hidden"><div><small>ADD ENGLISH WORD</small><h2>영어 단어 추가</h2></div><form><label>단어<input id="term" maxlength="120" required placeholder="strategy"></label><label>뜻<input id="meaning" maxlength="1000" placeholder="전략"></label><label>발음<input id="pronunciation" maxlength="1000" placeholder="/ˈstrætədʒi/"></label><label class="wide">메모<textarea id="note" maxlength="1000" placeholder="예문이나 기억할 내용을 적어보세요"></textarea></label><button>저장</button></form></section>
<section class="tools"><input id="search" type="search" placeholder="단어·뜻·메모 검색"><button id="add-english">+ 영어 단어</button></section><section id="list" class="list"><p class="empty">단어장을 불러오는 중…</p></section></main>
<nav class="dock"><a href="/#home">홈</a><a href="/epub/">일본어</a><a href="/english/">영어</a><a class="active" href="/vocabulary/">단어장</a></nav>
<div id="practice" class="practice hidden" role="dialog" aria-modal="true" aria-labelledby="practice-title"><section class="practice-panel"><header><div><small>VOCABULARY PRACTICE</small><h2 id="practice-title">단어 연습</h2></div><button id="practice-close" aria-label="연습 닫기">×</button></header><p id="practice-target" class="practice-target"></p><p id="practice-guide" class="practice-guide"></p><div id="write-pane" class="hidden"><canvas id="write-canvas" width="640" height="440" aria-label="손으로 단어를 쓰는 영역"></canvas><div class="practice-buttons"><button id="write-clear">지우기</button><button id="write-grade" class="primary">채점</button></div></div><div id="speak-pane" class="hidden"><div class="speech-meter"><i id="speech-meter-bar"></i></div><p id="speech-result">먼저 단어를 듣고 녹음을 시작하세요.</p><div class="practice-buttons"><button id="practice-listen">🔊 단어 듣기</button><button id="speech-record" class="primary">● 녹음 시작</button></div></div><p id="practice-score" class="practice-score hidden"></p></section></div>
