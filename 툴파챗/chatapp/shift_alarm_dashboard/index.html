<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#201b2f">
  <title>Shift Alarm · 오늘의 컨트롤</title><link rel="stylesheet" href="/shift-alarm/static/style.css?v=20260908-sunzi-light-v1"><link rel="stylesheet" href="/shift-alarm/static/enhancements.css">
</head>
<body>
  <header><a href="/#systems">← 시스템</a><div><small>SHIFT ALARM</small><h1>오늘의 컨트롤</h1></div><button id="refresh" type="button">새로고침</button></header>
  <main><div id="notice" class="notice hidden" role="status"></div><section id="summary" class="summary" aria-label="오늘 상태"></section>
    <section class="panel sunzi-panel"><div><small>SUNZI · LIGHT</small><h2>오늘의 병법 구절 분석</h2><p id="sunzi-analysis-status">다음 미완료 구절을 라이트 모드로 분석합니다.</p></div><button id="start-sunzi-analysis" type="button">분석 시작하기</button></section>
    <section class="panel"><div class="panel-head"><div><small>TODAY</small><h2>오늘의 리마인더</h2></div><a id="notion-link" target="_blank" rel="noopener">Notion에서 보기 ↗</a></div><div id="today-reminders" class="check-list"></div></section>
    <details class="panel"><summary><div><small>DAILY ROUTINE</small><h2>일일 루틴 체크리스트 <span id="routine-count"></span></h2></div><span class="summary-arrow">⌄</span></summary><div class="panel-head action-head"><p>목록을 펼쳐 오늘의 루틴을 확인하세요.</p><button id="check-all" type="button" disabled>전부 체크하기</button></div><div id="routine" class="check-list"></div></details>
    <details class="panel"><summary><div><small>SCHEDULE</small><h2>리마인더 시각 설정</h2></div><span class="summary-arrow">⌄</span></summary><div class="panel-head action-head"><p>근무 유형을 고른 뒤 각 리마인더 시각을 수정할 수 있습니다.</p><label class="profile-picker">근무 유형 <select id="time-profile"><option>시각</option><option>Swing</option><option>Day</option><option>GY</option><option>S-D휴</option><option>D-G휴</option><option>G-S휴</option></select></label></div><div class="table-wrap"><table><thead><tr><th>리마인더</th><th>선택 시각</th><th>상태</th><th></th></tr></thead><tbody id="schedule"></tbody></table></div></details>
    <p id="updated" class="updated"></p></main><script src="/shift-alarm/static/app.js?v=20260908-sunzi-light-v1"></script>
</body></html>
