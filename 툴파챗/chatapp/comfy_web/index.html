<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ComfyUI 작업실 · 나툼</title><meta name="theme-color" content="#111923"><link rel="icon" href="/static/app-icon-192.png"><link rel="stylesheet" href="/comfy/static/style.css?v=20260928-v1"></head><body>
<header><a href="/#home">‹ 홈</a><div><small>ADMIN IMAGE LAB</small><h1>ComfyUI 작업실</h1></div><button id="refresh">새로고침</button></header>
<main>
  <section class="hero"><div><span id="lamp"></span><b id="runtime">확인 중</b><p id="runtime-note">Mac의 ComfyUI 상태를 확인하고 있습니다.</p></div><label class="switch"><input id="power" type="checkbox"><i></i><span>전원</span></label></section>
  <section><div class="section-head"><div><small>NOW</small><h2>현재 작업</h2></div><span id="checked"></span></div><div id="active" class="cards"><p class="empty">현재 작업을 확인하는 중입니다.</p></div></section>
  <section><div class="section-head"><div><small>COMFY QUEUE</small><h2>실행·대기열</h2></div><div class="counts"><b id="running-count">0</b> 실행 · <b id="pending-count">0</b> 대기</div></div><div id="queue" class="queue"></div><div class="actions"><button id="interrupt" class="danger">현재 생성 중단</button><button id="clear" class="warn">대기열 비우기</button></div></section>
  <section><div class="section-head"><div><small>NATUM PIPELINE</small><h2>미연시 이미지 일괄 작업</h2></div><span id="backlog-state"></span></div><div class="progress"><i id="progress-bar"></i></div><p id="backlog-detail">상태를 확인 중입니다.</p><div class="actions"><button id="resume">미완성 이미지 작업 시작</button><a href="/dating-sim/">미연시 제작 현황</a></div></section>
  <section><details><summary><span><small>DIAGNOSTICS</small><b>Comfy 로그 보기</b></span><i>＋</i></summary><pre id="logs">로그를 불러오는 중입니다.</pre></details></section>
</main><div id="toast" role="status"></div><script src="/comfy/static/app.js?v=20260928-v1"></script></body></html>
