<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>툴파시스템</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- 방 목록 (카카오톡 채팅 목록처럼) -->
  <div id="room-list-view">
    <header><h1>툴파시스템</h1></header>
    <div id="room-list"><div class="empty-hint">불러오는 중...</div></div>
  </div>

  <!-- 채팅방 -->
  <div id="chat-view" class="hidden">
    <header class="chat-header">
      <button id="back-btn" type="button" aria-label="뒤로">‹</button>
      <h1 id="room-title"></h1>
      <button id="invite-btn" type="button" aria-label="참여자 보기" class="hidden">👥</button>
    </header>
    <div id="invite-panel" class="hidden">
      <div class="invite-panel-title">현재 참여자</div>
      <div id="member-list"></div>
      <div id="invite-section" class="hidden">
        <div class="invite-panel-title">초대하기</div>
        <div id="invite-list"></div>
      </div>
    </div>
    <main id="messages"></main>
    <div id="reply-banner" class="hidden">
      <span id="reply-banner-text"></span>
      <button id="reply-cancel-btn" type="button" aria-label="답장 취소">✕</button>
    </div>
    <form id="composer">
      <button id="upload-btn" type="button" aria-label="사진 첨부">📷</button>
      <input id="image-input" type="file" accept="image/*" class="hidden">
      <input id="input" type="text" placeholder="메시지 입력" autocomplete="off">
      <button type="submit">보내기</button>
    </form>
  </div>

  <script src="/static/chat.js"></script>
</body>
</html>
