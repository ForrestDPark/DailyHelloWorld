<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>툴파시스템</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- 로그인/가입 화면 -->
  <div id="auth-view" class="hidden">
    <div class="auth-card">
      <h1 class="auth-title">툴파시스템</h1>
      <p class="auth-subtitle">페르소나들과 나누는 대화방</p>
      <div id="auth-tabs">
        <button type="button" class="auth-tab active" data-mode="login">로그인</button>
        <button type="button" class="auth-tab" data-mode="signup">가입하기</button>
      </div>
      <form id="auth-form">
        <input id="auth-username" type="text" placeholder="아이디" autocomplete="username" required>
        <input id="auth-password" type="password" placeholder="비밀번호" autocomplete="current-password" required>
        <div id="auth-error" class="hidden"></div>
        <button type="submit" id="auth-submit">로그인</button>
      </form>
    </div>
  </div>

  <!-- 방 목록 (카카오톡 채팅 목록처럼) -->
  <div id="room-list-view" class="hidden">
    <header>
      <h1>툴파시스템</h1>
      <button id="new-room-btn" type="button" aria-label="새 채팅방 만들기" class="hidden">➕</button>
      <button id="persona-manager-btn" type="button" aria-label="내 페르소나 관리" class="hidden">🎭</button>
      <button id="admin-btn" type="button" aria-label="권한 관리" class="hidden">⚙️</button>
      <div id="account-chip" class="hidden">
        <span id="account-name"></span>
        <button id="logout-btn" type="button" aria-label="로그아웃">로그아웃</button>
      </div>
    </header>
    <div id="admin-panel" class="hidden">
      <div class="invite-panel-title">유이(UI 개발자) 편집 권한 관리</div>
      <div id="admin-user-list"></div>
    </div>
    <div id="persona-manager-panel" class="hidden">
      <div class="invite-panel-title">내가 만든 페르소나</div>
      <div id="my-personas-list"></div>
      <form id="my-persona-form">
        <input id="my-persona-name" type="text" placeholder="이름 (1~20자)" maxlength="20">
        <textarea id="my-persona-desc" placeholder="성격, 말투, 배경 등을 자유롭게 적어주세요" rows="4" maxlength="2000"></textarea>
        <div id="my-persona-error" class="hidden"></div>
        <div class="my-persona-form-actions">
          <button type="submit" id="my-persona-submit">만들기</button>
          <button type="button" id="my-persona-cancel-edit" class="hidden">취소</button>
        </div>
      </form>
    </div>
    <div id="room-list"><div class="empty-hint">불러오는 중...</div></div>
  </div>

  <!-- 채팅방 -->
  <div id="chat-view" class="hidden">
    <header class="chat-header">
      <button id="back-btn" type="button" aria-label="뒤로">‹</button>
      <h1 id="room-title"></h1>
      <button id="invite-btn" type="button" aria-label="참여자 보기" class="hidden">👥</button>
    </header>
    <div id="invite-panel" class="hidden">
      <div class="invite-panel-title">현재 참여자</div>
      <div id="member-list"></div>
      <div id="invite-section" class="hidden">
        <div class="invite-panel-title">초대하기</div>
        <div id="invite-list"></div>
      </div>
    </div>
    <main id="messages"></main>
    <div id="reply-banner" class="hidden">
      <span id="reply-banner-text"></span>
      <button id="reply-cancel-btn" type="button" aria-label="답장 취소">✕</button>
    </div>
    <form id="composer">
      <button id="upload-btn" type="button" aria-label="사진 첨부">📷</button>
      <input id="image-input" type="file" accept="image/*" class="hidden">
      <input id="input" type="text" placeholder="메시지 입력" autocomplete="off">
      <button type="submit">보내기</button>
    </form>
  </div>

  <script src="/static/chat.js"></script>
</body>
</html>
