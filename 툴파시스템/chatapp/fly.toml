# Fly.io 배포 설정. 자세한 배포 절차는 ../README.md 참고.
app = "tulpa-chatapp-pulpilisory"
primary_region = "nrt"

[build]

[mounts]
  source = "chatapp_data"
  destination = "/data"

[env]
  # ★ 2026-08-24: 전체 채팅방이 페르소나 전원 동시 반응 + 없는 친분 지어내기
  # 문제로 "당분간 폐쇄" 요청 — false로 두면 방 목록에서 빠지고 새 메시지도
  # 거부된다. 1:1 방은 영향 없음. 다시 켜려면 "true"로 바꾸고 재배포.
  GROUP_ROOM_ENABLED = "false"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
